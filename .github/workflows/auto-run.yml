name: Auto Curation Bot

on:
  schedule:
    # 매일 한국 시간 오전 8시 (UTC 기준 전날 23시) 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      - name: Java 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 자바 봇 실행 및 마크다운 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
        run: |
          chmod +x gradlew
          ./gradlew run

      # -----------------------------------------------------------
      # [추가된 부분] 자바 봇이 만든 posts 폴더를 Hugo 구조에 맞게 이동
      # -----------------------------------------------------------
      - name: Hugo 구조에 맞게 폴더 이동
        run: |
          mkdir -p content/posts
          # posts 폴더 안의 내용물(*)만 content/posts 안으로 쏙 이동
          mv posts/* content/posts/
          # 껍데기만 남은 빈 posts 폴더는 삭제
          rm -rf posts

      - name: Hugo 설치
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Hugo 정적 웹사이트 빌드
        run: hugo --destination public

      - name: 생성된 마크다운 및 빌드 결과물 깃허브에 푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout gradlew || true
          
          # [여기 수정] posts/ 제외
          git add --all content/ public/
          
          git stash
          git pull origin main --rebase
          git stash pop || true
          
          # [여기 수정] posts/ 제외
          git add --all content/ public/
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate curation post and build site" && git push origin main)