name: Auto Curation Bot

on:
  schedule:
    # 매일 한국 시간 오전 8시 (UTC 기준 전날 23시) 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 소스코드 가져오기
      uses: actions/checkout@v4

    - name: Java 세팅 (버전에 맞게 숫자 수정 가능)
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 자바 봇 실행 및 마크다운 생성
      # 아까 등록해둔 Repository secrets를 환경 변수로 주입합니다.
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
        ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
      run: |
        chmod +x gradlew
        ./gradlew run  # (주의) 프로젝트가 Maven이면 mvn exec:java 등 본인 환경에 맞는 실행 명령어로 수정하세요.

    - name: 생성된 마크다운 파일 깃허브에 푸시
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # posts 폴더 내의 변경된 마크다운 파일을 스테이징
        git add posts/
        
        # 변경사항이 있을 경우에만 커밋 및 푸시 진행
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate curation post" && git push)
