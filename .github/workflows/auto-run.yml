name: Auto Curation Bot

on:
  schedule:
    # 매일 한국 시간 오전 8시 (UTC 기준 전날 23시) 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      - name: Java 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 자바 봇 실행 및 마크다운 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
        run: |
          chmod +x gradlew
          ./gradlew run

      - name: Hugo 설치
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Hugo 정적 웹사이트 빌드
        run: hugo --destination public

      - name: 생성된 마크다운 및 빌드 결과물 깃허브에 푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # gradlew 등의 불필요한 시스템 파일 변경사항은 초기화
          git checkout gradlew || true
          
          # 1. 새로 생성된 마크다운 파일(posts/)과 Hugo 빌드 결과물(public/)을 스테이징합니다.
          git add posts/ public/
          
          # 2. 작업 내용을 임시 저장(stash)하여 작업 디렉토리를 깨끗하게 만듭니다.
          git stash
          
          # 3. 원격 저장소의 최신 변경사항을 안전하게 동기화합니다.
          git pull origin main --rebase
          
          # 4. 아까 숨겨둔(stash) 변경사항을 다시 불러옵니다.
          git stash pop || true
          
          # 5. 다시 한 번 확실하게 스테이징
          git add posts/ public/
          
          # 6. 변경사항이 있을 경우에만 커밋 및 푸시 진행
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate curation post and build site" && git push origin main)