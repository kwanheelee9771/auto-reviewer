name: Auto Curation Bot

on:
  schedule:
    # 매일 한국 시간 오전 8시 (UTC 기준 전날 23시) 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      - name: Java 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 자바 봇 실행 및 마크다운 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew run

      # -----------------------------------------------------------
      # [수정 1] 폴더 이동 에러 해결 (mv 대신 cp -r 사용)
      # 기존 폴더가 있어도 에러 나지 않고 내용물만 안전하게 병합 복사
      # -----------------------------------------------------------
      - name: Hugo 구조에 맞게 폴더 이동
        run: |
          mkdir -p content/posts
          cp -r posts/* content/posts/
          rm -rf posts

      - name: Hugo 설치
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Hugo 정적 웹사이트 빌드
        run: hugo --destination public

      # -----------------------------------------------------------
      # [수정 2] 카테고리 증발 에러 해결 (git add -f 옵션 추가)
      # 깃허브가 카테고리 폴더를 무시하지 못하도록 강제로 커밋에 포함
      # -----------------------------------------------------------
      - name: 생성된 마크다운 및 빌드 결과물 깃허브에 푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout gradlew || true
          
          # 새롭게 생성된 카테고리 데이터 강제 추적
          git add -f content/ public/
          
          git stash
          git pull origin main --rebase
          git stash pop || true
          
          # 깃풀(Pull) 이후 다시 한번 꼼꼼하게 강제 추적
          git add -f content/ public/
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate curation post and build site" && git push origin main)