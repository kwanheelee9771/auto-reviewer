plugins {
    id 'java'
    id 'application' // 추가
}

application {
    mainClass = 'com.autopublisher.UniversalCurationPublisher' // 대표님의 실제 메인 클래스 경로로 수정
}

group = 'com.autopublisher'
version = '1.0-SNAPSHOT'

// Java 17 환경에서 Java 8(1.8) 호환으로 컴파일 강제
sourceCompatibility = '1.8'
targetCompatibility = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    // Java 8 호환 마지막 버전
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jsoup:jsoup:1.15.4'
}

// 의존성을 포함한 Fat JAR 빌드 설정
jar {
    manifest {
        attributes(
                'Main-Class': 'com.autopublisher.UniversalCurationPublisher'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}